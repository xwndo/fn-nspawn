name: Build and Release fpk

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      fnpack_version:
        description: "fnpack CLI version to download"
        required: false
        default: "1.2.3"
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Test & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Go unit tests
        run: go test -count=1 -v ./...

      - name: Run Go vet (amd64 & arm64)
        run: |
          GOOS=linux GOARCH=amd64 go vet ./...
          GOOS=linux GOARCH=arm64 go vet ./...

      - name: Check frontend JavaScript syntax
        run: node --check web/static/app.js

      - name: Validate FPK JSON configs and shell scripts
        run: |
          jq empty fpk/wizard/install fpk/app/ui/config fpk/config/privilege fpk/config/resource
          bash -n scripts/build.sh fpk/cmd/*

  build:
    name: Build fpk (${{ matrix.arch }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build .fpk package
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          FNPACK_VER: ${{ inputs.fnpack_version || '1.2.3' }}
        run: bash scripts/build.sh

      - name: Generate SHA256 checksum
        run: |
          cd dist
          sha256sum *.fpk > SHA256SUMS-${{ matrix.arch }}.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: fn-nspawn-${{ matrix.arch }}
          path: dist/*
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Rebuild combined SHA256SUMS.txt
        run: |
          cd dist
          rm -f SHA256SUMS-*.txt
          sha256sum *.fpk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Extract release notes
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          tag = os.environ["TAG_NAME"]
          notes = ""
          changelog = Path("CHANGELOG.md")
          if changelog.is_file():
              text = changelog.read_text(encoding="utf-8")
              pattern = rf"(?ms)^##\s+\[?{re.escape(tag)}\]?[^\n]*\n(.*?)(?=^##\s+|\Z)"
              m = re.search(pattern, text)
              if m:
                  notes = m.group(1).strip()

          if not notes:
              res = subprocess.run(
                  ["git", "tag", "-l", "--format=%(contents)", tag],
                  capture_output=True,
                  text=True,
                  check=False,
              )
              notes = res.stdout.strip()

          parts = []
          if notes:
              parts.append(notes)
          parts.append(
              "### 安装说明\n"
              f"- **x86_64 架构**：下载 `fn-nspawn-{tag}-x86.fpk`\n"
              f"- **ARM64 架构**：下载 `fn-nspawn-{tag}-arm.fpk`\n"
              "- 打开飞牛 fnOS「应用中心 → 手动安装」，选择对应架构的 `.fpk` 安装包上传覆盖升级即可（已创建的容器与 `container.json` 配置会自动保留）。\n"
              "- 可选校验下载完整性：`sha256sum -c SHA256SUMS.txt`"
          )
          out = "\n\n".join(parts) + "\n"
          Path("release_notes.md").write_text(out, encoding="utf-8")
          print(out)
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release_notes.md
          generate_release_notes: true
          files: |
            dist/*.fpk
            dist/SHA256SUMS.txt
