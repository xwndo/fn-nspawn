name: Build and Release fpk

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      fnpack_version:
        description: "fnpack CLI version to download"
        required: false
        default: "1.2.3"
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Test & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Go unit tests
        run: go test -count=1 -v ./...

      - name: Run Go vet (amd64 & arm64)
        run: |
          GOOS=linux GOARCH=amd64 go vet ./...
          GOOS=linux GOARCH=arm64 go vet ./...

      - name: Check frontend JavaScript syntax
        run: node --check web/static/app.js

      - name: Validate FPK JSON configs and shell scripts
        run: |
          jq empty fpk/wizard/install fpk/app/ui/config fpk/config/privilege fpk/config/resource
          bash -n scripts/build.sh fpk/cmd/*

  build:
    name: Build fpk (${{ matrix.arch }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build .fpk package
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          FNPACK_VER: ${{ inputs.fnpack_version || '1.2.3' }}
        run: bash scripts/build.sh

      - name: Generate SHA256 checksum
        run: |
          cd dist
          sha256sum *.fpk > SHA256SUMS-${{ matrix.arch }}.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: fn-nspawn-${{ matrix.arch }}
          path: dist/*
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Rebuild combined SHA256SUMS.txt
        run: |
          cd dist
          rm -f SHA256SUMS-*.txt
          sha256sum *.fpk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.fpk
            dist/SHA256SUMS.txt
